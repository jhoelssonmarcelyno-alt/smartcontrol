{% extends 'layout.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8 text-center md:text-left">
        <h2 class="text-3xl font-bold text-white"><i class="fas fa-users text-blue-500 mr-2"></i> Novo Cliente</h2>
        <p class="text-gray-400">Cadastre clientes para gerenciar o saldo devedor (fiado).</p>
    </div>

    <form method="POST" class="bg-[#1e293b] p-8 rounded-2xl border border-gray-700 shadow-2xl space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Nome Completo</label>
            <input type="text" name="nome" required placeholder="Ex: Seu Madruga" 
                   class="w-full bg-[#0f172a] border border-gray-600 rounded-lg p-3 text-white focus:border-blue-500 outline-none transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">WhatsApp / Telefone</label>
            <input type="text" name="telefone" placeholder="(11) 99999-9999"
                   class="w-full bg-[#0f172a] border border-gray-600 rounded-lg p-3 text-white focus:border-blue-500 outline-none transition">
        </div>

        <div class="flex space-x-4 pt-4">
            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-blue-900/20">
                <i class="fas fa-user-plus mr-2"></i> Cadastrar Cliente
            </button>
            <a href="/" class="flex-1 bg-gray-700 hover:bg-gray-600 text-center py-3 rounded-lg font-bold transition">
                Voltar
            </a>
        </div>
    </form>
</div>
{% endblock %}
