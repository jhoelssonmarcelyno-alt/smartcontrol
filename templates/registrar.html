<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - SmartControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white flex items-center justify-center min-h-screen">

    <div class="bg-[#1e293b] p-8 rounded-3xl shadow-2xl border border-gray-700 w-full max-w-md animate-fadeIn">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-500 italic">SmartControl</h1>
            <p class="text-gray-400 text-sm mt-2">Comece seus 7 dias de teste gratuito!</p>
        </div>
        
        <form action="/registrar" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm text-gray-400 mb-1 ml-1">Nome Completo</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="nome" required placeholder="Seu nome" 
                           class="w-full bg-[#0f172a] border border-gray-600 rounded-xl py-3 pl-10 pr-4 outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1 ml-1">E-mail</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required placeholder="exemplo@email.com" 
                           class="w-full bg-[#0f172a] border border-gray-600 rounded-xl py-3 pl-10 pr-4 outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1 ml-1">Crie uma Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="senha" required placeholder="••••••••" 
                           class="w-full bg-[#0f172a] border border-gray-600 rounded-xl py-3 pl-10 pr-4 outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-blue-500/20 transform hover:scale-[1.02]">
                Criar minha conta
            </button>
        </form>
        
        <div class="mt-8 pt-6 border-t border-gray-700 text-center">
            <p class="text-gray-500 text-sm">Já tem uma conta? 
                <a href="/login" class="text-blue-500 font-bold hover:underline">Faça login</a>
            </p>
        </div>
    </div>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
    </style>
</body>
</html>
