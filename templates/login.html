<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - SmartControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white flex items-center justify-center min-h-screen">
    <div class="bg-[#1e293b] p-10 rounded-3xl shadow-2xl border border-gray-700 w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-green-500 mb-8 italic">SmartControl</h1>
        
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Seu Email</label>
                <input type="email" name="email" required class="w-full bg-[#0f172a] border border-gray-600 rounded-xl p-3 outline-none focus:border-green-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">Sua Senha</label>
                <input type="password" name="senha" required class="w-full bg-[#0f172a] border border-gray-600 rounded-xl p-3 outline-none focus:border-green-500">
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold transition">Entrar no Sistema</button>
        </form>
        
        <p class="text-center text-gray-500 text-xs mt-6">Ainda não tem conta? <a href="/planos" class="text-green-500">Escolha um plano</a></p>
    </div>
</body>
</html>
