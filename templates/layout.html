<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Gestão Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .nav-link { @apply flex items-center px-4 py-2 rounded-lg transition-all duration-300; }
        .active-link { @apply bg-green-600 text-white shadow-lg shadow-green-900/20; }
        
        /* Animação suave para troca de páginas */
        .animate-fadeIn {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white font-sans min-h-screen">

    <nav class="bg-[#1e293b] border-b border-white/5 shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='/'">
                <div class="relative w-10 h-10 overflow-hidden rounded-lg shadow-lg shadow-green-500/20">
                    {% if session.get('usuario_logo') %}
                        <img src="{{ url_for('static', filename='uploads/' + session['usuario_logo']) }}" 
                             class="w-full h-full object-cover">
                    {% else %}
                        <div class="bg-green-500 w-full h-full flex items-center justify-center">
                            <i class="fas fa-rocket text-[#1e293b]"></i>
                        </div>
                    {% endif %}
                </div>
                <h1 class="text-xl font-black tracking-tighter uppercase italic text-white">
                    {{ session.get('nome', 'Smart') }}<span class="text-green-500">Control</span>
                </h1>
            </div>
            
            <div class="flex items-center space-x-6">
                <a href="/configuracoes" class="text-gray-400 hover:text-white transition group" title="Configurações">
                    <i class="fas fa-cog group-hover:rotate-90 transition duration-500"></i>
                </a>

                <div class="border-l border-white/10 h-6"></div>

                <a href="/logout" class="text-gray-400 hover:text-red-500 transition-colors flex items-center font-bold text-xs uppercase tracking-widest">
                    <i class="fas fa-power-off mr-2"></i> Sair
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 min-h-[calc(100vh-200px)]">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-10 text-gray-600 text-xs uppercase tracking-widest border-t border-white/5 mt-10">
        &copy; 2026 SmartControl System - Todos os direitos reservados
    </footer>

</body>
</html>
