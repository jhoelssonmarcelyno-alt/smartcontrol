<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Gestão Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .nav-link { @apply flex items-center px-4 py-2 rounded-lg transition-all duration-300; }
        .active-link { @apply bg-green-600 text-white shadow-lg shadow-green-900/20; }
    </style>
</head>
<body class="bg-[#0f172a] text-white font-sans min-h-screen">

    <nav class="bg-[#1e293b] border-b border-white/5 shadow-2xl">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='/'">
                <div class="relative w-10 h-10 overflow-hidden rounded-lg shadow-lg shadow-green-500/20">
                    {% if session.get('usuario_logo') %}
                        <img src="{{ url_for('static', filename='uploads/' + session['usuario_logo']) }}" 
                             class="w-full h-full object-cover">
                    {% else %}
                        <div class="bg-green-500 w-full h-full flex items-center justify-center">
                            <i class="fas fa-rocket text-[#1e293b]"></i>
                        </div>
                    {% endif %}
                </div>
                <h1 class="text-xl font-black tracking-tighter uppercase italic text-white">
                    {{ session.get('nome', 'Smart') }}<span class="text-green-500">Control</span>
                </h1>
            </div>
            
            <div class="hidden md:flex items-center space-x-2">
                <a href="/" class="flex items-center px-4 py-2 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition">
                    <i class="fas fa-chart-line mr-2 text-blue-400"></i> Dashboard
                </a>
                
                <a href="/produtos" class="flex items-center px-4 py-2 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition">
                    <i class="fas fa-boxes mr-2 text-purple-400"></i> Estoque
                </a>

                <a href="/clientes" class="flex items-center px-4 py-2 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition">
                    <i class="fas fa-user-friends mr-2 text-emerald-400"></i> Clientes
                </a>

                <a href="/configuracoes" class="flex items-center px-4 py-2 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition" title="Configurações">
                    <i class="fas fa-cog mr-1 text-gray-400"></i>
                </a>

                <a href="/vendas" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-xl font-bold transition flex items-center shadow-lg shadow-green-900/40">
                    <i class="fas fa-shopping-cart mr-2"></i> Nova Venda
                </a>
            </div>

            <div class="flex items-center border-l border-white/10 ml-4 pl-4">
                <a href="/logout" class="text-gray-400 hover:text-red-500 transition-colors flex items-center font-medium text-sm">
                    <i class="fas fa-power-off mr-2"></i> Sair
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-10 text-gray-600 text-xs uppercase tracking-widest">
        &copy; 2024 SmartControl System - Todos os direitos reservados
    </footer>

</body>
</html>
