{% extends 'layout.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-white">📦 Cadastrar Produto</h2>
        <p class="text-gray-400">Adicione novos itens ao seu estoque.</p>
    </div>

    <form method="POST" class="bg-[#1e293b] p-8 rounded-2xl border border-gray-700 shadow-2xl space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Nome do Produto</label>
            <input type="text" name="nome" required placeholder="Ex: Coca-Cola 2L" 
                   class="w-full bg-[#0f172a] border border-gray-600 rounded-lg p-3 text-white focus:border-green-500 outline-none transition">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Preço de Custo (R$)</label>
                <input type="number" step="0.01" name="preco_custo" required placeholder="0.00"
                       class="w-full bg-[#0f172a] border border-gray-600 rounded-lg p-3 text-white focus:border-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Preço de Venda (R$)</label>
                <input type="number" step="0.01" name="preco_venda" required placeholder="0.00"
                       class="w-full bg-[#0f172a] border border-gray-600 rounded-lg p-3 text-white focus:border-green-500 outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Quantidade Inicial</label>
            <input type="number" name="quantidade" required placeholder="0"
                   class="w-full bg-[#0f172a] border border-gray-600 rounded-lg p-3 text-white focus:border-green-500 outline-none">
        </div>

        <div class="flex space-x-4 pt-4">
            <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-green-900/20">
                <i class="fas fa-save mr-2"></i> Salvar Produto
            </button>
            <a href="/" class="flex-1 bg-gray-700 hover:bg-gray-600 text-center py-3 rounded-lg font-bold transition">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
